title: Suspicious PowerShell Execution Policy Bypass
id: 9a5b3a4a-115f-4927-a068-18eb9800a741
status: experimental
description: Detects PowerShell being executed with the ExecutionPolicy Bypass flag.
level: high
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense_evasion
  - attack.t1222
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\powershell.exe'
    CommandLine|contains: 'ExecutionPolicy Bypass'
  condition: selection